<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siddu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;

      background:
        radial-gradient(circle at 20% 30%, #243b80 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #5b247a 0%, transparent 35%),
        linear-gradient(135deg, #050816, #111827, #020617);
    }

    /* Animated glowing background */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: float 10s infinite alternate ease-in-out;
    }

    .orb1 {
      width: 180px;
      height: 180px;
      background: #2563eb;
      top: 10%;
      left: 5%;
    }

    .orb2 {
      width: 220px;
      height: 220px;
      background: #9333ea;
      bottom: 5%;
      right: 5%;
      animation-delay: 2s;
    }

    .orb3 {
      width: 140px;
      height: 140px;
      background: #06b6d4;
      top: 55%;
      left: 45%;
      animation-delay: 4s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(50px, -40px) scale(1.25);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: clamp(50px, 15vw, 90px);
      letter-spacing: 8px;
      margin-bottom: 35px;
      text-shadow: 0 0 25px rgba(255,255,255,0.35);
    }

    .search-box {
      width: 100%;
      height: 62px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-radius: 35px;

      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(18px);

      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    .search-icon {
      font-size: 24px;
      margin-right: 14px;
      opacity: 0.8;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 19px;
    }

    input::placeholder {
      color: rgba(255,255,255,0.65);
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.55;
    }

    @media (max-width: 500px) {
      .search-box {
        height: 58px;
      }

      input {
        font-size: 17px;
      }

      h1 {
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="container">
    <h1>SIDDU</h1>

    <form
      class="search-box"
      action="https://www.google.com/search"
      method="GET"
    >
      <span class="search-icon">⌕</span>

      <input
        type="search"
        name="q"
        placeholder="Search Google..."
        autocomplete="off"
        autofocus
      >
    </form>

    <div class="hint">Press Enter to search</div>
  </div>

</body>
  </html>
