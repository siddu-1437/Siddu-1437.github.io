<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <style>
    /* ==============================
       BASIC RESET
       ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }


    /* ==============================
       VIDEO BACKGROUND
       ============================== */

    #background-video {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

      background: #000;
    }


    /* ==============================
       DARK OVERLAY
       ============================== */

    .overlay {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.15);

      z-index: 2;

      pointer-events: none;
    }


    /* ==============================
       SEARCH CONTAINER
       ============================== */

    .search-container {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform: translateX(-50%);

      width: 90%;

      max-width: 650px;

      z-index: 10;
    }


    /* ==============================
       SEARCH BAR
       ============================== */

    .search-box {
      width: 100%;

      height: 58px;

      display: flex;

      align-items: center;

      padding: 0 20px;

      border-radius: 32px;

      background: rgba(255, 255, 255, 0.16);

      border: 1px solid rgba(255, 255, 255, 0.55);

      backdrop-filter: blur(14px);

      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.45),
        inset 0 0 15px rgba(255, 255, 255, 0.05);

      transition: 0.25s ease;
    }


    /* ==============================
       SEARCH ICON
       ============================== */

    .search-icon {
      color: white;

      font-size: 25px;

      margin-right: 12px;

      opacity: 0.9;
    }


    /* ==============================
       SEARCH INPUT
       ============================== */

    .search-input {
      flex: 1;

      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      color: white;

      font-size: 17px;

      font-weight: 400;
    }


    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
    }


    /* ==============================
       FOCUS EFFECT
       ============================== */

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.22);

      border-color: rgba(255, 255, 255, 0.85);

      box-shadow:
        0 8px 35px rgba(0, 0, 0, 0.55),
        0 0 20px rgba(255, 255, 255, 0.12);
    }


    /* ==============================
       MOBILE PHONE
       ============================== */

    @media (max-width: 600px) {

      .search-container {
        width: 90%;

        bottom: 25px;
      }

      .search-box {
        height: 56px;

        padding: 0 18px;

        border-radius: 30px;
      }

      .search-icon {
        font-size: 23px;

        margin-right: 10px;
      }

      .search-input {
        font-size: 16px;
      }
    }


    /* ==============================
       VERY SMALL SCREENS
       ============================== */

    @media (max-height: 600px) {

      .search-container {
        bottom: 15px;
      }
    }

  </style>
</head>


<body>


  <!-- =================================
       BACKGROUND VIDEO
       ================================= -->

  <video
    id="background-video"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">

    <source
      src="girl-behind-curtains.720x1280.mp4"
      type="video/mp4">

  </video>


  <!-- =================================
       OVERLAY
       ================================= -->

  <div class="overlay"></div>


  <!-- =================================
       GOOGLE SEARCH
       ================================= -->

  <div class="search-container">

    <form
      class="search-box"
      action="https://www.google.com/search"
      method="GET">

      <span class="search-icon">⌕</span>

      <input
        class="search-input"
        type="search"
        name="q"
        placeholder="Search Google..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false">

    </form>

  </div>


  <!-- =================================
       VIDEO AUTOPLAY
       ================================= -->

  <script>

    const video =
      document.getElementById("background-video");

    function startVideo() {

      video.play().catch(() => {

        // Some browsers require a user interaction.
        // The video is muted, so Chrome normally
        // allows autoplay.

      });

    }

    window.addEventListener("load", startVideo);

    document.addEventListener(
      "visibilitychange",
      () => {

        if (!document.hidden) {
          startVideo();
        }

      }
    );

  </script>


</body>
</html>
