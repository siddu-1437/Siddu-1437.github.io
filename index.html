<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Siddu</title>

  <!-- Cursive font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* Full-screen video */
    #background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      z-index: -2;
    }

    /* Main content */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 90%;
      max-width: 650px;

      text-align: center;
    }

    /* SIDDU */
    .title {
      color: white;
      font-family: "Dancing Script", cursive;
      font-size: clamp(65px, 16vw, 110px);
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 28px;

      text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 25px rgba(255,255,255,0.45);
    }

    /* Search bar */
    .search-box {
      width: 100%;
      height: 62px;

      display: flex;
      align-items: center;

      padding: 0 22px;

      border-radius: 35px;

      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.55);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 8px 35px rgba(0,0,0,0.45),
        inset 0 0 15px rgba(255,255,255,0.08);
    }

    .search-icon {
      color: white;
      font-size: 25px;
      margin-right: 12px;
    }

    .search-input {
      flex: 1;

      border: none;
      outline: none;

      background: transparent;

      color: white;
      font-size: 18px;
    }

    .search-input::placeholder {
      color: rgba(255,255,255,0.8);
    }

    /* Mobile */
    @media (max-width: 600px) {

      .content {
        width: 88%;
      }

      .title {
        font-size: 75px;
        margin-bottom: 25px;
      }

      .search-box {
        height: 58px;
      }

      .search-input {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Your uploaded video -->
  <video
    id="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source src="rain-drops-on-window.3840x2160.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <main class="content">

    <div class="title">Siddu</div>

    <form
      class="search-box"
      action="https://www.google.com/search"
      method="GET">

      <span class="search-icon">⌕</span>

      <input
        class="search-input"
        type="search"
        name="q"
        placeholder="Search Google..."
        autocomplete="off"
        autofocus>

    </form>

  </main>

</body>
</html>
